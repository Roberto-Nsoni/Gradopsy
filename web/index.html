<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>visualML — a machine-learning engine, cut open</title>
    <meta name="description" content="A machine-learning engine written from scratch in NumPy, running in your browser. Watch a network learn, step by step, and scrub back through it." />
    <link rel="preload" href="/fonts/archivo-var.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  </head>
  <body>
    <!--
      THESIS: A cathode ray tube with a machine-learning engine drawing on it, learning in front
      of you and never quite finished. Refuses the headline-over-a-button landing, the white
      explorable-explanation page this category ships, and the dark dashboard with a neon accent
      that "retro screen" collapses into when nobody is watching.
      OWN-WORLD: Near-black green #060D09 ground, one phosphor #7DFFBE that is the only light on
      the page, a brighter #C9FF4A strike for the single action, and two field inks, #39FF9E and
      #2896FF, mixed into the ground in proportion to how sure the network is. Scanlines at a 3px
      pitch, a ten-division graticule, hairlines. Archivo roman tracked upper case for every word,
      Martian Mono for every number, no italic anywhere. No radius, no shadow, no gradient.
      STORY: A sceptic sees a network learning from a random start before reading a word, takes
      hold of an observation and watches the cut work at it, then finds the plates and the source.
      FIRST VIEWPORT: The live field covers the whole screen. A panel of type at the left holds
      the claim, one sentence, and two actions; the readouts sit along the foot. A different
      choreography every load, out of eight, so the shape of the problem is never a fixed image.
      FORM: The Phosphor Screen, chosen from nine built studies over Riso overprint and the
      synoptic chart; direction seed 9a0328e5.
      FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review,
      the verdict, DESIGN.md, and every shipping raster carrying its provenance.
    -->
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
